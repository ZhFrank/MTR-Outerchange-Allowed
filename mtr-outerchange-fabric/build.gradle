plugins {
	id 'fabric-loom' version '1.7.4'
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

sourceSets {
	main {
		java {
			srcDirs += "src/variants/${project.variant_family}"
			srcDirs += "src/variants/${project.minecraft_version}"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Minecraft Transit Railway 4.x - never shipped, only compiled against. modImplementation rather
	// than compileOnly so Loom remaps the published intermediary jar onto the named mappings; without
	// that, every Minecraft type reachable from an MTR class (class_437, class_4185, ...) stays
	// intermediary and any source that touches both hierarchies fails to compile.
	modImplementation files(project.mtr_file)
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "java_version", project.java_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft_version": project.minecraft_version, "java_version": project.java_version
	}
}

def targetJavaVersion = (project.target_java as String).toInteger()

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = targetJavaVersion
}

java {
	sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
	targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
